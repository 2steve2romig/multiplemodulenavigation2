# CI — SureTrend Platform
#
# Two jobs, both required status checks on main (configure in GitHub
# Settings → Branches → Branch protection rules):
#
#   unit        — always runs; no secrets needed; blocks merge on failure
#   integration — runs when secrets are configured; includes the cross-tenant
#                 isolation security gate (test-strategy.md §c)
#
# Required GitHub repository secrets (Settings → Secrets → Actions):
#   PLATFORM_URL              — deployed Vercel URL, e.g. https://suretrend-platform.vercel.app
#   ADMIN_SECRET              — value of ADMIN_SECRET env var on Vercel
#   TENANT_A_ID               — UUID of test tenant A in the test Supabase project
#   TENANT_B_ID               — UUID of test tenant B (different entitlements from A)
#   SUPABASE_URL              — test Supabase project URL
#   SUPABASE_SERVICE_ROLE_KEY — test Supabase service role key (server-only)
#   SUPABASE_ANON_KEY         — test Supabase anon key (for RLS bypass tests)
#
# NEVER configure these secrets against the production Supabase project.
# Use a dedicated test Supabase project with all migrations applied and
# seed data matching the test expectations.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit -- --ci --forceExit

  integration:
    name: Integration + isolation tests (security gate)
    runs-on: ubuntu-latest
    needs: unit
    env:
      PLATFORM_URL:              ${{ secrets.PLATFORM_URL }}
      ADMIN_SECRET:              ${{ secrets.ADMIN_SECRET }}
      TENANT_A_ID:               ${{ secrets.TENANT_A_ID }}
      TENANT_B_ID:               ${{ secrets.TENANT_B_ID }}
      SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ANON_KEY:         ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run integration + isolation tests
        run: npm run test:integration -- --ci --forceExit
