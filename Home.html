  <script>
    // Asset resolver for standalone-bundled builds. In the live (served) file
    // there are no ext-resource-dependency meta tags, so RES() returns the
    // original relative path unchanged. In the bundled file, meta tags + the
    // bundler's window.__resources map relative paths to inlined blob URLs.
    window.RES = function (p) {
      if (!p) return p;
      var key = String(p).split('?')[0];
      if (window.__resources) {
        if (!window.__assetMap) {
          window.__assetMap = {};
          var metas = document.querySelectorAll('meta[name="ext-resource-dependency"]');
          for (var i = 0; i < metas.length; i++) {
            var c = (metas[i].getAttribute('content') || '').split('?')[0];
            var id = metas[i].getAttribute('data-resource-id');
            if (c && id && window.__resources[id]) window.__assetMap[c] = window.__resources[id];
          }
        }
        if (window.__assetMap[key]) return window.__assetMap[key];
      }
      return p;
    };
  </script>
